core_values:
  - Craft
  - Health
  - Relationships
  - Long-term growth
non_negotiables:
  - Do not trade correctness for speed when production or security risk is material.
  - Protect sleep and important relationship commitments.
definitions_of_success:
  - Build durable technical judgment, not just a larger task count.
unacceptable_tradeoffs:
  - Chronic overwork
  - Misrepresenting confidence or evidence
